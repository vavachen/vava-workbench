name: 每日自动更新工作台数据

on:
  schedule:
    # 每天北京时间 06:00（UTC 22:00 前一天）
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成当日数据
        run: node scripts/gen-daily.mjs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/xhs-daily.json data/travel-daily.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动更新每日数据 $(date +%F)"
            git push
          fi
