<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="420" height="250" fill="#F8F6F2"/>
  <text x="210" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#4F8E86">C 大调音阶 · 右手指法</text>
  <!-- white keys -->
  <g>
    <rect x="20" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="66" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="112" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="158" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="204" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="250" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="296" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="342" y="70" width="44" height="130" rx="4" fill="#fff" stroke="#d8d2c8"/>
  </g>
  <g fill="#3a3a3a">
    <rect x="56" y="70" width="26" height="84" rx="3"/>
    <rect x="102" y="70" width="26" height="84" rx="3"/>
    <rect x="194" y="70" width="26" height="84" rx="3"/>
    <rect x="240" y="70" width="26" height="84" rx="3"/>
