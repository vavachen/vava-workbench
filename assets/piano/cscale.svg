  </g>
  <!-- finger numbers above -->
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#D08068">
    <text x="42" y="58">1</text><text x="88" y="58">2</text><text x="134" y="58">3</text>
    <text x="180" y="58">1</text><text x="226" y="58">2</text><text x="272" y="58">3</text>
    <text x="318" y="58">4</text><text x="364" y="58">5</text>
  </g>
  <!-- note names below -->
  <g text-anchor="middle" font-size="12" fill="#6b6b6b">
    <text x="42" y="218">C</text><text x="88" y="218">D</text><text x="134" y="218">E</text>
    <text x="180" y="218">F</text><text x="226" y="218">G</text><text x="272" y="218">A</text>
    <text x="318" y="218">B</text><text x="364" y="218">C</text>
