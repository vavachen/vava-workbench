<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="420" height="250" fill="#F8F6F2"/>
  <text x="210" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#4F8E86">延音踏板 · 右踏板</text>
  <!-- floor -->
  <rect x="0" y="200" width="420" height="50" fill="#EDE7DF"/>
  <!-- piano body -->
  <rect x="30" y="60" width="120" height="120" rx="6" fill="#3a3a3a"/>
  <rect x="30" y="60" width="120" height="22" rx="6" fill="#4a4a4a"/>
  <!-- leg -->
  <rect x="120" y="180" width="14" height="40" fill="#2a2a2a"/>
  <!-- pedal -->
  <rect x="200" y="186" width="120" height="12" rx="6" fill="#9a7b5d"/>
  <rect x="196" y="170" width="12" height="22" fill="#9a7b5d"/>
  <!-- foot -->
  <g fill="#E8C9A8" stroke="#cba985" stroke-width="2">
    <path d="M300 150 Q330 150 340 175 L340 188 L300 188 Q290 170 300 150 Z"/>
    <path d="M300 150 Q280 150 270 172 L300 188 Z"/>
  </g>
  <!-- arrow press -->
  <line x1="340" y1="120" x2="340" y2="170" stroke="#D08068" stroke-width="2.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D08068"/></marker></defs>
  <text x="352" y="120" font-size="11" fill="#D08068" font-weight="700">脚尖踩下</text>
  <text x="210" y="228" text-anchor="middle" font-size="10.5" fill="#9a948a">换和弦时「手弹新音、脚换踏板」（切分踏板），别踩太深发浑</text>
</svg>
