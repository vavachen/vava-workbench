<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="420" height="250" fill="#F8F6F2"/>
  <text x="210" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#4F8E86">三个常用和弦 · C / F / G</text>
  <!-- C chord -->
  <g transform="translate(20,55)">
    <rect x="0" y="20" width="120" height="46" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="34" y="20" width="16" height="30" fill="#333"/>
    <rect x="78" y="20" width="16" height="30" fill="#333"/>
    <circle cx="20" cy="14" r="9" fill="#D08068"/>
    <circle cx="64" cy="14" r="9" fill="#D08068"/>
    <circle cx="100" cy="14" r="9" fill="#D08068"/>
    <text x="60" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#D08068">C = C E G</text>
  </g>
  <!-- F chord -->
  <g transform="translate(150,55)">
    <rect x="0" y="20" width="120" height="46" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="34" y="20" width="16" height="30" fill="#333"/>
    <rect x="78" y="20" width="16" height="30" fill="#333"/>
    <circle cx="20" cy="14" r="9" fill="#6BA8A0"/>
    <circle cx="64" cy="14" r="9" fill="#6BA8A0"/>
    <circle cx="100" cy="14" r="9" fill="#6BA8A0"/>
    <text x="60" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#4F8E86">F = F A C</text>
  </g>
  <!-- G chord -->
  <g transform="translate(280,55)">
    <rect x="0" y="20" width="120" height="46" rx="4" fill="#fff" stroke="#d8d2c8"/>
    <rect x="34" y="20" width="16" height="30" fill="#333"/>
    <rect x="78" y="20" width="16" height="30" fill="#333"/>
    <circle cx="20" cy="14" r="9" fill="#B08968"/>
    <circle cx="64" cy="14" r="9" fill="#B08968"/>
    <circle cx="100" cy="14" r="9" fill="#B08968"/>
    <text x="60" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#B08968">G = G B D</text>
  </g>
  <!-- I-IV-V -->
  <g transform="translate(0,170)">
    <rect x="60" y="10" width="300" height="40" rx="8" fill="#EAF2F0"/>
    <text x="210" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#4F8E86">I (C) — IV (F) — V (G) · 万能进行</text>
  </g>
  <text x="210" y="232" text-anchor="middle" font-size="10.5" fill="#9a948a">三个音「同时落下」，保留共同音让转换更顺</text>
</svg>
