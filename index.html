<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F6F2" />
  <title>VAVA 工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="mask" class="mask"></div>
    <div class="content">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="batch-bar" class="batch-bar">
    <span id="batch-info" class="bb-info">已选 0 项</span>
    <button id="batch-all" class="btn sm">全选</button>
    <button id="batch-del" class="btn sm coral">🗑 批量删除</button>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/plans.js"></script>
  <script src="js/piano-curriculum.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
